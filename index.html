<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Happy 2nd Anniversary, Babi!</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
</head>
<body>
    <!-- Audio element -->
    <audio id="bgMusic" loop>
        <source src="d4vd - Here With Me (Instrumental).mp3" type="audio/mp3">
        Your browser does not support the audio element.
    </audio>

    <!-- Music control button -->
    <button id="musicControl" class="music-control">
        <i class="fas fa-music"></i>
    </button>

    <div class="container">
        <div class="invitation">
            <h1>My Dearest Babi ❤️</h1>
            <div class="heart"></div>
            <h2>Happy 2nd Anniversary Bab!</h2>
            <p>Two beautiful years of love, laughter, and countless memories together.</p>
            <p>Would you like to celebrate our special day with me?</p>
            <div class="buttons">
                <button id="yesBtn" class="btn yes-btn">Yes!</button>
                <button id="noBtn" class="btn no-btn">No</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
